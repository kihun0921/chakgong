# /etc/nginx/conf.d/chakgong.conf — chakgong.allcaresolution.net (docs/DEPLOY.md)
server {
    listen 80;
    server_name chakgong.allcaresolution.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name chakgong.allcaresolution.net;

    ssl_certificate     /etc/letsencrypt/live/chakgong.allcaresolution.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chakgong.allcaresolution.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;          # SR-NF-14: TLS 1.2 이상

    # 업로드 한도: PDF 1개 100MB(+여유), 합본 PDF 100MB
    client_max_body_size 120m;
    proxy_read_timeout   120s;                    # 합본 PDF 생성 시간 여유

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
